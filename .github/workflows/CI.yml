name: CI
on: pull_request
permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test:
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: pnpm

      # Get projects set up
      - run: pnpm install
      - run: pnpm bootstrap
      - run: pnpm build

      # Run any tests
      - run: pnpm test
        env:
          CI: true

  test-svelte4:
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: pnpm

      # Lets us use one-liner JSON manipulations the package.json files
      - run: "npm install -g json"

      # Get projects set up
      # NOTE: pnpm 11+ no longer reads the "pnpm" field in package.json. When bumping the
      # packageManager version to pnpm 11 or higher, this override needs to move to pnpm-workspace.yaml
      - run: json -I -f package.json -e 'this.pnpm={"overrides":{"svelte":"^4.2.0"}}'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm bootstrap
      - run: pnpm build

      # Run any tests
      - run: pnpm test
        env:
          CI: true

  lint:
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: pnpm

      # Get projects set up
      - run: pnpm install
      - run: pnpm lint
